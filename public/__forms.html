<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Formulários</title>
  </head>
  <body>
    <!-- Definição estática lida pela Netlify no deploy. O formulário de
         verdade fica em /autorizacao e envia para este endereço. -->
    <form name="autorizacao-imagem" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="protocolo" />
      <input name="versao_do_termo" />
      <input name="assinado_em" />
      <input name="quem_assina" />
      <input name="pessoa_nas_imagens" />
      <input name="nome_de_quem_assina" />
      <input name="cpf_de_quem_assina" />
      <input name="whatsapp" />
      <input name="uso_redes_sociais" />
      <input name="uso_site" />
      <input name="uso_anuncios_pagos" />
      <input name="pode_mostrar_o_rosto" />
      <input name="momentos_dificeis" />
      <textarea name="termo_aceito"></textarea>
      <input type="file" name="assinatura" />
    </form>
  </body>
</html>
